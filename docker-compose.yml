services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: asatte-app:latest
    pull_policy: build
    restart: unless-stopped
    environment:
      - PHP_OPCACHE_ENABLE=1
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=sep-common-db-1
      - DB_PORT=3306
      - DB_DATABASE=asatte
      - DB_USERNAME=root
      - DB_PASSWORD=${SHARED_DB_PASSWORD}
    networks:
      - asatte_net
      - npm_default
      - sep_common_net
    volumes:
      - ./storage:/var/www/html/storage

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: asatte-app:latest
    pull_policy: build
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      - PHP_OPCACHE_ENABLE=1
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=sep-common-db-1
      - DB_PORT=3306
      - DB_DATABASE=asatte
      - DB_USERNAME=root
      - DB_PASSWORD=${SHARED_DB_PASSWORD}
    networks:
      - asatte_net
      - sep_common_net

networks:
  asatte_net:
  npm_default:
    external: true
  sep_common_net:
    external: true
