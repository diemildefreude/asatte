services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: asatte-app:latest
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=netart
      - DB_USERNAME=netart_user
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - asatte_net

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: netart
      MYSQL_USER: netart_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - asatte_net

networks:
  asatte_net:

volumes:
  mysql_data:
