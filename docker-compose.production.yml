services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: asatte-app:latest
    pull_policy: build
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=asatte
      - DB_USERNAME=netart_user
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - asatte_net
      - npm_default
    volumes:
      - ./storage:/var/www/html/storage

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: asatte
      MYSQL_USER: netart_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - asatte_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 300M
    networks:
      - asatte_net
      - npm_default

networks:
  asatte_net:
  npm_default:
    external: true

volumes:
  mysql_data:
