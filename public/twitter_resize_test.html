<!DOCTYPE html>
<html>
<head>
<title>Twitter Iframe Resize Test</title>
</head>
<body>
<iframe id="test-iframe" src="https://platform.twitter.com/embed/Tweet.html?id=1598908837549215744" width="550" height="200" frameborder="0" scrolling="no" allowtransparency="true"></iframe>

<script>
window.addEventListener('message', (event) => {
    console.log("RECEIVED MESSAGE:", event.data);
    let data;
    try {
        data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
    } catch (e) {
        return;
    }
    
    if (data && data['twttr.embed']) {
        console.log("TWITTER EMBED MESSAGE:", data['twttr.embed']);
    }
    
    // Check if it's a resize message
    if (data && data['twttr.embed'] && data['twttr.embed'].method === 'twttr.private.resize') {
        const height = data['twttr.embed'].params[0].height;
        console.log("RESIZING TO:", height);
        const iframes = document.querySelectorAll('iframe');
        for (let i = 0; i < iframes.length; i++) {
            if (iframes[i].contentWindow === event.source) {
                iframes[i].style.height = height + 'px';
                break;
            }
        }
    }
});
</script>
</body>
</html>
