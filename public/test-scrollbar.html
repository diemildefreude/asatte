<!DOCTYPE html>
<html>
<head>
<style>
.tox-tinymce {
    height: 580px !important;
    width: 320px;
    border: 1px solid black;
    background: purple;
}
iframe {
    width: 100%;
    height: 100%; /* If tinymce resizes the iframe, what height is it? */
    border: none;
}
</style>
</head>
<body>
<div class="tox-tinymce">
    <iframe id="editor_ifr"></iframe>
</div>
<script>
    const ifr = document.getElementById('editor_ifr');
    const doc = ifr.contentDocument;
    doc.open();
    doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
        <style>
        html { height: 100%; overflow-y: hidden !important; }
        body { min-height: 100%; background: red; margin: 0; }
        iframe { width: 560px; height: 315px; } /* forces horizontal overflow */
        </style>
        </head>
        <body>
            <iframe src="about:blank"></iframe>
        </body>
        </html>
    `);
    doc.close();
</script>
</body>
</html>
